name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          git archive --format=zip --prefix=black-hat-md-${GITHUB_REF_NAME}/ "${GITHUB_REF_NAME}" \
            -o "black-hat-md-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: black-hat-md-${{ github.ref_name }}.zip
